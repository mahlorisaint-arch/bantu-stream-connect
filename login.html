<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login - Bantu Stream Connect</title>

    <!-- Clickjacking defense-in-depth, run as early as possible: if this
         page is ever loaded inside a frame (e.g. an attacker's page with an
         invisible iframe overlaying fake buttons on top of the real login
         form to steal clicks/credentials), break out of it immediately.
         This is a fallback for exactly the gap the CSP note below explains -
         frame-ancestors doesn't work from a <meta> tag, only a real HTTP
         header, which this static site isn't currently configured to send. -->
    <script>
        if (window.top !== window.self) {
            window.top.location = window.self.location;
        }
    </script>

    <!-- Content-Security-Policy — this page handles credentials directly,
         so it gets the strictest baseline on the site: only the specific
         CDN origins this page actually uses are allowed to load anything,
         and no <base> tag or plugin objects can be injected. 'unsafe-inline'
         is kept for script/style because the page's CSS and JS are both
         inline blocks below - a nonce/hash-based policy would be stronger
         but means the policy breaks every time this file is edited unless
         the hash is recomputed in lockstep, which isn't a trade worth
         making here. This still blocks the main threat of loading a
         malicious script/stylesheet from an arbitrary third-party origin.

         frame-ancestors is deliberately NOT here - the CSP spec has browsers
         silently ignore that directive entirely when it's delivered via a
         <meta> tag (it only takes effect as a real HTTP response header),
         so putting it here would just be a false claim of protection.
         Clickjacking is instead blocked below via a frame-busting script,
         until/unless the host is configured to send a real
         Content-Security-Policy: frame-ancestors 'none' (or
         X-Frame-Options: DENY) response header - see note above the script. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data:;
        connect-src 'self' https://ydnxqnbjoshvxteevemc.supabase.co wss://ydnxqnbjoshvxteevemc.supabase.co;
        base-uri 'self';
        object-src 'none';
    ">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome — pinned version + SRI hash (verified against the
         bytes actually served at this URL) so a compromised CDN can't
         silently swap in malicious CSS on the page that handles credentials. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">

    <!-- Supabase JS SDK — pinned to an exact version + SRI hash (was a
         floating "@2" tag with no integrity check at all; a compromised or
         MITM'd CDN response here would have full access to this page's
         login/signup form fields before anything is even submitted). The
         bare "@2" URL is also jsDelivr's dynamically-generated entry point
         (it literally warns against using SRI with it) - this uses the
         direct static file path instead, which is safe to hash. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.js" integrity="sha384-6foGJ1oz/y3anEo0BXRtTgBK1GvpnR0GbJZb0ijG+nBAJ4rYT+VqlD/9e3CSiFIA" crossorigin="anonymous"></script>

    <style>
        :root {
            --deep-black: #000000;
            --deep-navy: #0F172A;
            --soft-white: #F8FAFC;
            --slate-grey: #94A3B8;
            --bantu-blue: #00E5FF;
            --warm-gold: #00E5FF;
            --error-color: #EF4444;
            --success-color: #10B981;
            --glow-cycle-1: #00E5FF;
            --glow-cycle-2: #00E5FF;
            --glow-cycle-3: #00E5FF;
            --glow-cycle-4: #00E5FF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--deep-black);
            color: var(--soft-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .animated-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .glow-cycle {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.1;
            animation: float 8s infinite ease-in-out;
        }

        .glow-1 {
            width: 400px;
            height: 400px;
            background: var(--glow-cycle-1);
            top: 10%;
            left: 5%;
        }

        .glow-2 {
            width: 300px;
            height: 300px;
            background: var(--glow-cycle-2);
            top: 60%;
            right: 10%;
        }

        .glow-3 {
            width: 350px;
            height: 350px;
            background: var(--glow-cycle-3);
            bottom: 10%;
            left: 20%;
        }

        .glow-4 {
            width: 250px;
            height: 250px;
            background: var(--glow-cycle-4);
            top: 20%;
            right: 20%;
        }

        @keyframes float {
            0%,100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .login-container {
            position: relative;
            z-index: 2;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 28px;
            background: linear-gradient(
                135deg,
                var(--soft-white) 0%,
                var(--bantu-blue) 50%,
                var(--warm-gold) 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-sub {
            font-size: 12px;
            color: var(--slate-grey);
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .tagline {
            text-align: center;
            color: var(--slate-grey);
            margin-bottom: 30px;
            font-size: 14px;
            font-style: italic;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
            padding-top: 20px;
        }

        .mode-toggle {
            display: flex;
            gap: 6px;
            background: rgba(6, 20, 26, 0.75);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 999px;
            padding: 4px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--slate-grey);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            border-radius: 999px;
        }

        .mode-btn:hover { color: var(--soft-white); }

        .mode-btn.active {
            background: rgba(0, 229, 255, 0.12);
            border-color: rgba(0, 229, 255, 0.4);
            color: var(--bantu-blue);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.15);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 16px 45px 16px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(148,163,184,0.2);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--bantu-blue);
            box-shadow: 0 0 0 3px rgba(0, 229, 255,0.1);
        }

        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--slate-grey);
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .btn-primary {
            background: rgba(6, 20, 26, 0.75);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: #00E5FF;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.15);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 229, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
            color: var(--slate-grey);
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(148,163,184,0.2);
        }

        .divider span {
            background: rgba(15,23,42,0.85);
            padding: 0 20px;
            position: relative;
        }

        .social-login {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 12px;
        }

        .social-btn {
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(148,163,184,0.2);
            background: rgba(255,255,255,0.05);
            color: white;
            cursor: pointer;
        }

        .error-message,
        .success-message {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .error-message {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.4);
            color: var(--error-color);
        }

        .success-message {
            background: rgba(16,185,129,0.15);
            border: 1px solid rgba(16,185,129,0.4);
            color: var(--success-color);
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .password-requirements {
            margin-top: 8px;
            font-size: 12px;
            color: var(--slate-grey);
        }

        .requirement {
            margin-bottom: 4px;
        }

        .requirement.valid {
            color: var(--success-color);
        }

        .social-note {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: var(--warm-gold);
        }

        @media(max-width: 480px) {
            .login-container {
                padding: 28px 20px;
            }

            .social-login {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="animated-bg">
    <div class="glow-cycle glow-1"></div>
    <div class="glow-cycle glow-2"></div>
    <div class="glow-cycle glow-3"></div>
    <div class="glow-cycle glow-4"></div>
</div>

<div class="login-container">

    <div class="logo">
        <div class="logo-text">BANTU STREAM CONNECT</div>
        <div class="logo-sub">PULSE • CONNECT • STREAM</div>
    </div>

    <p class="tagline">"NO DNA, JUST RSA."</p>

    <div class="mode-toggle">
        <button class="mode-btn active" id="loginBtnTab">
            Sign In
        </button>

        <button class="mode-btn" id="signupBtnTab">
            Sign Up
        </button>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">

        <div class="form-group">
            <label class="form-label">Email Address</label>

            <input
                type="email"
                class="form-input"
                id="loginEmail"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <i class="fas fa-envelope input-icon"></i>
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>

            <input
                type="password"
                class="form-input"
                id="loginPassword"
                placeholder="Your password"
                autocomplete="current-password"
                required
            >

            <i class="fas fa-eye input-icon" id="toggleLoginPassword"></i>
        </div>

        <button type="submit" class="btn btn-primary" id="loginSubmitBtn">
            Sign In to Bantu Stream Connect
        </button>

    </form>

    <!-- SIGNUP FORM -->
    <form id="signupForm" style="display:none;">

        <div class="form-group">
            <label class="form-label">Full Name</label>

            <input
                type="text"
                class="form-input"
                id="signupFullName"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

            <i class="fas fa-user input-icon"></i>
        </div>

        <div class="form-group">
            <label class="form-label">Email Address</label>

            <input
                type="email"
                class="form-input"
                id="signupEmail"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <i class="fas fa-envelope input-icon"></i>
        </div>

        <div class="form-group">
            <label class="form-label">Create Password</label>

            <input
                type="password"
                class="form-input"
                id="signupPassword"
                placeholder="Create a strong password"
                autocomplete="new-password"
                required
            >

            <i class="fas fa-eye input-icon" id="toggleSignupPassword"></i>

            <div class="password-requirements">
                <div class="requirement" id="reqLength">
                    • At least 8 characters
                </div>

                <div class="requirement" id="reqUppercase">
                    • One uppercase letter
                </div>

                <div class="requirement" id="reqNumber">
                    • One number
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Confirm Password</label>

            <input
                type="password"
                class="form-input"
                id="signupConfirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
                required
            >

            <i class="fas fa-eye input-icon" id="toggleConfirmPassword"></i>
        </div>

        <button type="submit" class="btn btn-primary" id="signupSubmitBtn">
            Create Bantu Stream Connect Account
        </button>

    </form>

    <div class="divider">
        <span>Or continue with</span>
    </div>

    <div class="social-login">

        <button class="social-btn" id="googleLogin">
            <i class="fab fa-google"></i> Google
        </button>

        <button class="social-btn" id="githubLogin">
            <i class="fab fa-github"></i> GitHub
        </button>

    </div>

    <p class="social-note">
        ⭐ Quick access with Google or GitHub
    </p>

</div>

<script>

    // SUPABASE
    const SUPABASE_URL = 'https://ydnxqnbjoshvxteevemc.supabase.co';

    const SUPABASE_ANON_KEY =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkbnhxbmJqb3Nodnh0ZWV2ZW1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2MzI0OTMsImV4cCI6MjA3MzIwODQ5M30.NlaCCnLPSz1mM7AFeSlfZQ78kYEKUMh_Fi-7P_ccs_U';

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

    const TARGET_REDIRECT_URL =
        'https://bantustreamconnect.com/';

    let isLoginMode = true;

    const loginBtnTab =
        document.getElementById('loginBtnTab');

    const signupBtnTab =
        document.getElementById('signupBtnTab');

    const loginForm =
        document.getElementById('loginForm');

    const signupForm =
        document.getElementById('signupForm');

    const errorMessage =
        document.getElementById('errorMessage');

    const successMessage =
        document.getElementById('successMessage');

    // FORM TOGGLE
    function toggleFormMode() {

        if (isLoginMode) {

            loginForm.style.display = 'none';
            signupForm.style.display = 'block';

            loginBtnTab.classList.remove('active');
            signupBtnTab.classList.add('active');

        } else {

            signupForm.style.display = 'none';
            loginForm.style.display = 'block';

            signupBtnTab.classList.remove('active');
            loginBtnTab.classList.add('active');
        }

        isLoginMode = !isLoginMode;

        errorMessage.style.display = 'none';
        successMessage.style.display = 'none';
    }

    // PASSWORD VALIDATION
    function validatePassword(password) {

        const requirements = {
            length: password.length >= 8,
            uppercase: /[A-Z]/.test(password),
            number: /[0-9]/.test(password)
        };

        document.getElementById('reqLength')
            .className = requirements.length
            ? 'requirement valid'
            : 'requirement';

        document.getElementById('reqUppercase')
            .className = requirements.uppercase
            ? 'requirement valid'
            : 'requirement';

        document.getElementById('reqNumber')
            .className = requirements.number
            ? 'requirement valid'
            : 'requirement';

        return (
            requirements.length &&
            requirements.uppercase &&
            requirements.number
        );
    }

    // PASSWORD TOGGLE
    function setupPasswordToggle(inputId, toggleId) {

        const input = document.getElementById(inputId);

        const toggle = document.getElementById(toggleId);

        toggle.addEventListener('click', () => {

            if (input.type === 'password') {
                input.type = 'text';
                toggle.className =
                    'fas fa-eye-slash input-icon';
            } else {
                input.type = 'password';
                toggle.className =
                    'fas fa-eye input-icon';
            }
        });
    }

    // USERNAME BASE — sanitized only. The on_auth_user_created DB trigger
    // (handle_new_creator()) appends its own uuid-based suffix server-side
    // and is what actually guarantees uniqueness, so there's no need to
    // pre-check availability of a candidate here (the old version of this
    // function did, but the value it checked was never what actually got
    // inserted anyway — the trigger always overrides the suffix).
    function sanitizeUsernameBase(fullName) {
        return fullName
            .toLowerCase()
            .trim()
            .replace(/\s+/g, '_')
            .replace(/[^a-z0-9_]/g, '') || 'user';
    }

    // Minimal HTML-escaping for values interpolated into innerHTML.
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // REDIRECT
    function redirectToTarget() {
        window.location.href =
            TARGET_REDIRECT_URL;
    }

    // LOGIN
    loginForm.addEventListener('submit', async (e) => {

        e.preventDefault();

        const email =
            document.getElementById('loginEmail').value;

        const password =
            document.getElementById('loginPassword').value;

        const loginSubmitBtn =
            document.getElementById('loginSubmitBtn');

        errorMessage.style.display = 'none';

        const originalText =
            loginSubmitBtn.innerHTML;

        loginSubmitBtn.innerHTML =
            '<div class="loading-spinner"></div> Signing in...';

        loginSubmitBtn.disabled = true;

        try {

            const { error } =
                await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

            if (error) throw error;

            successMessage.innerHTML =
                '✨ Login successful! Redirecting...';

            successMessage.style.display = 'block';

            setTimeout(() => {
                redirectToTarget();
            }, 1500);

        } catch (error) {

            errorMessage.textContent =
                error.message || 'Login failed';

            errorMessage.style.display = 'block';

            loginSubmitBtn.innerHTML =
                originalText;

            loginSubmitBtn.disabled = false;
        }
    });

    // SIGNUP
    signupForm.addEventListener('submit', async (e) => {

        e.preventDefault();

        const fullName =
            document.getElementById('signupFullName')
                .value
                .trim();

        const email =
            document.getElementById('signupEmail')
                .value
                .trim();

        const password =
            document.getElementById('signupPassword')
                .value;

        const confirmPassword =
            document.getElementById('signupConfirmPassword')
                .value;

        const signupSubmitBtn =
            document.getElementById('signupSubmitBtn');

        errorMessage.style.display = 'none';

        successMessage.style.display = 'none';

        if (password !== confirmPassword) {

            errorMessage.textContent =
                'Passwords do not match';

            errorMessage.style.display = 'block';

            return;
        }

        if (!validatePassword(password)) {

            errorMessage.textContent =
                'Password does not meet requirements';

            errorMessage.style.display = 'block';

            return;
        }

        signupSubmitBtn.innerHTML =
            '<div class="loading-spinner"></div> Creating account...';

        signupSubmitBtn.disabled = true;

        try {

            const usernameBase =
                sanitizeUsernameBase(fullName);

            // CREATE AUTH USER — the on_auth_user_created DB trigger
            // (handle_new_creator()) inserts the matching user_profiles AND
            // creators rows atomically, server-side, as soon as this
            // succeeds. There used to be a second client-side insert into
            // user_profiles right after this, which always collided with
            // the row the trigger had already created (ON CONFLICT DO
            // NOTHING on the trigger's side, but a plain .insert() here) —
            // every signup was silently succeeding while showing the user
            // "Signup failed". Removed; the real (trigger-generated)
            // username is fetched back below instead of guessed client-side.
            const {
                data: authData,
                error: authError
            } = await supabaseClient.auth.signUp({

                email,
                password,

                options: {

                    emailRedirectTo:
                        TARGET_REDIRECT_URL,

                    data: {
                        full_name: fullName,
                        username: usernameBase
                    }
                }
            });

            if (authError) throw authError;

            const user = authData.user;

            if (!user) {
                throw new Error(
                    'User creation failed'
                );
            }

            // user_profiles is public-SELECT-readable, so this works even
            // when email confirmation is required and there's no session
            // yet. Best-effort only — the account is already fully created
            // either way, this is purely for display.
            const { data: profileRow } =
                await supabaseClient
                    .from('user_profiles')
                    .select('username')
                    .eq('id', user.id)
                    .maybeSingle();

            const username = profileRow?.username;

            successMessage.innerHTML = `
                ✨ Account created successfully!<br><br>
                ${username ? `Your creator username:<br><strong>@${escapeHtml(username)}</strong><br><br>` : ''}
                Please verify your email.
            `;

            successMessage.style.display = 'block';

            signupForm.reset();

            signupSubmitBtn.innerHTML =
                'Check your email';

        } catch (error) {

            console.error(error);

            errorMessage.textContent =
                error.message || 'Signup failed';

            errorMessage.style.display = 'block';

            signupSubmitBtn.innerHTML =
                'Create Bantu Stream Connect Account';

            signupSubmitBtn.disabled = false;
        }
    });

    // PASSWORD VALIDATION REALTIME
    document.getElementById('signupPassword')
        .addEventListener('input', (e) => {
            validatePassword(e.target.value);
        });

    // GOOGLE LOGIN
    document.getElementById('googleLogin')
        .addEventListener('click', async () => {

            await supabaseClient.auth
                .signInWithOAuth({

                    provider: 'google',

                    options: {
                        redirectTo:
                            TARGET_REDIRECT_URL
                    }
                });
        });

    // GITHUB LOGIN
    document.getElementById('githubLogin')
        .addEventListener('click', async () => {

            await supabaseClient.auth
                .signInWithOAuth({

                    provider: 'github',

                    options: {
                        redirectTo:
                            TARGET_REDIRECT_URL
                    }
                });
        });

    // PASSWORD TOGGLES
    setupPasswordToggle(
        'loginPassword',
        'toggleLoginPassword'
    );

    setupPasswordToggle(
        'signupPassword',
        'toggleSignupPassword'
    );

    setupPasswordToggle(
        'signupConfirmPassword',
        'toggleConfirmPassword'
    );

    // FORM TOGGLE EVENTS
    loginBtnTab.addEventListener(
        'click',
        toggleFormMode
    );

    signupBtnTab.addEventListener(
        'click',
        toggleFormMode
    );

    // SESSION CHECK
    async function checkSession() {

        const {
            data: { session }
        } = await supabaseClient
            .auth
            .getSession();

        if (session) {
            redirectToTarget();
        }
    }

    checkSession();

    // AUTH LISTENER
    supabaseClient.auth.onAuthStateChange(
        (event, session) => {

            if (
                event === 'SIGNED_IN' &&
                session
            ) {
                redirectToTarget();
            }
        }
    );

</script>

</body>
</html>
