<!DOCTYPE html>
<html>
<head>
    <script>
        // Runs before anything else on the page - redirects instantly on
        // mobile so there's no visible "choose your platform" step, which
        // is the whole point of this page (one link for Google/Meta/TikTok
        // ads and social bios instead of a click-through chooser).
        (function () {
            var ua = navigator.userAgent || navigator.vendor || window.opera || '';
            var androidUrl = 'https://play.google.com/store/apps/details?id=com.bsc.app';
            var iosUrl = 'https://apps.apple.com/us/app/bantu-stream-connect/id6797660273';

            var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream ||
                (ua.indexOf('Macintosh') !== -1 && navigator.maxTouchPoints > 1); // iPadOS reporting as desktop Safari
            var isAndroid = /android/i.test(ua);

            if (isIOS) {
                window.location.replace(iosUrl);
            } else if (isAndroid) {
                window.location.replace(androidUrl);
            }
            // Desktop/unrecognized: falls through and shows the page below
            // with both store links visible instead of guessing.
        })();
    </script>
    <title>Get Bantu Stream Connect</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon/favicon-48x48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #0A0E12;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            max-width: 380px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #00E5FF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h3 {
            margin: 0 0 8px;
        }
        p {
            color: #94A3B8;
            margin: 0 0 24px;
        }
        .store-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .store-links a {
            display: block;
            padding: 14px 20px;
            border-radius: 10px;
            border: 1px solid rgba(0, 229, 255, 0.35);
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: border-color 0.2s, background 0.2s;
        }
        .store-links a:hover {
            border-color: #00E5FF;
            background: rgba(0, 229, 255, 0.08);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h3>Taking you to Bantu Stream Connect...</h3>
        <p>If nothing happens, pick your platform below.</p>
        <div class="store-links">
            <a href="https://apps.apple.com/us/app/bantu-stream-connect/id6797660273">Download on the App Store</a>
            <a href="https://play.google.com/store/apps/details?id=com.bsc.app">Get it on Google Play</a>
        </div>
    </div>
</body>
</html>
