<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bantu Shorts - Bantu Stream Connect</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Supabase JS SDK -->
  <!-- Deferred (same fix applied to content-detail.html): lets these
       download in parallel with the rest of the page instead of blocking
       HTML parsing one at a time. Safe here - shorts-detail.js creates
       its Supabase client inside its own DOMContentLoaded listener, not
       at top-level script execution, and shared-components.js (which had
       a top-level dependency on this) isn't even loaded on this page. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

  <!-- Swiper for Shorts Carousel -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>

  <!-- Shared search-modal styling (same rules content-detail.html and
       trending_screen.html use), loaded before shorts-detail.css so
       page-specific rules can still override where needed. -->
  <link rel="stylesheet" href="css/shared-components.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/shorts-detail.css">
</head>
<body>
  <!-- Connection-failure fallback (hidden unless Supabase genuinely fails to
       load - normal loading is skeleton-first, see .shorts-skeleton-slide
       below, not a blocking spinner). -->
  <div id="shorts-loading" class="shorts-loading" style="display:none;">
    <i class="fas fa-exclamation-circle fallback-icon"></i>
    <div id="loading-text">Loading Shorts...</div>
  </div>

  <!-- Top Bar -->
  <header class="shorts-topbar">
    <div class="shorts-logo" onclick="window.location.href='index.html'">
      <img src="assets/icon/bantu_stream_connect_icon.png" alt="BSC">
    </div>
    <div class="feed-tabs" id="feed-tabs">
      <button class="feed-tab active" data-feed="foryou">For You</button>
      <button class="feed-tab" data-feed="following">Following</button>
    </div>
    <div class="topbar-actions">
      <button id="notifications-btn" class="icon-btn-glass" title="Notifications">
        <i class="fas fa-bell"></i>
        <span class="notification-badge" id="notification-count" style="display: none;">0</span>
      </button>
      <button id="search-btn" class="icon-btn-glass" title="Search">
        <i class="fas fa-search"></i>
      </button>
    </div>
  </header>

  <!-- Segmented progress bar - one segment per loaded short, filled by real
       video playback progress (js/shorts-detail.js: handleTimeUpdate /
       Swiper slideChange), not a decorative timer. -->
  <div class="shorts-progress-segments" id="shorts-progress-segments"></div>

  <!-- Main Shorts Player -->
  <div class="shorts-player-container" id="shorts-player">
    <div class="swiper shorts-swiper" id="shorts-swiper">
      <div class="swiper-wrapper" id="shorts-wrapper">
        <!-- Skeleton-first placeholder, shaped like a real slide - replaced
             entirely by renderShorts() once real data loads (same pattern
             just built for the home feed). -->
        <div class="swiper-slide shorts-skeleton-slide">
          <div class="short-video-wrapper">
            <div class="skeleton-video-fill"></div>
            <div class="shorts-actions">
              <div class="skeleton-action-circle"></div>
              <div class="skeleton-action-circle"></div>
              <div class="skeleton-action-circle"></div>
              <div class="skeleton-action-circle"></div>
              <div class="skeleton-action-circle"></div>
            </div>
            <div class="shorts-info">
              <div class="creator-info">
                <div class="skeleton-avatar-circle"></div>
                <div class="skeleton-line-group">
                  <div class="skeleton-line short"></div>
                  <div class="skeleton-line shorter"></div>
                </div>
              </div>
              <div class="skeleton-line"></div>
              <div class="skeleton-line short"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="double-tap-indicator" id="double-tap-indicator">
      <i class="fas fa-heart"></i>
    </div>

    <div class="play-pause-overlay" id="play-pause-overlay">
      <i class="fas fa-play" id="play-pause-icon"></i>
    </div>

    <!-- More Menu (Three Dots) -->
    <div class="more-menu" id="more-menu">
      <button class="more-menu-item" id="more-report">
        <i class="fas fa-flag"></i>
        <span>Report</span>
      </button>
      <button class="more-menu-item" id="more-mute">
        <i class="fas fa-volume-mute"></i>
        <span>Mute Creator</span>
      </button>
      <button class="more-menu-item" id="more-not-interested">
        <i class="fas fa-thumbs-down"></i>
        <span>Not Interested</span>
      </button>
      <button class="more-menu-item danger" id="more-block">
        <i class="fas fa-ban"></i>
        <span>Block Creator</span>
      </button>
    </div>
  </div>

  <!-- Bottom Navigation - same live pattern already used on
       search.html (shown at all sizes, no sidebar on this page). -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="window.location.href='index.html'">
      <i class="fas fa-home nav-icon"></i>
      <span>Home</span>
    </button>
    <button class="nav-item" onclick="window.location.href='explore-screen.html'">
      <i class="fas fa-compass nav-icon"></i>
      <span>Explore</span>
    </button>
    <button class="nav-item nav-create" onclick="window.location.href='creator-upload.html'" title="Create">
      <i class="fas fa-plus"></i>
    </button>
    <button class="nav-item" onclick="window.location.href='discover-creator.html'">
      <i class="fas fa-users nav-icon"></i>
      <span>Creators</span>
    </button>
    <button class="nav-item" id="profile-btn" title="Profile">
      <i class="fas fa-user nav-icon"></i>
      <span>Profile</span>
    </button>
  </nav>

  <!-- SEARCH MODAL - same engine/markup pattern as content-detail.html and
       trending_screen.html (js/shared-components.js's search functions,
       ported into js/shorts-detail.js below) instead of a separate, weaker
       bespoke implementation. -->
  <div id="search-modal" class="search-modal">
    <div class="search-modal-overlay"></div>
    <div class="search-modal-content">
      <div class="search-modal-header">
        <div class="search-input-wrapper">
          <input type="text" id="search-input" class="search-input"
                 placeholder="Search shorts, creators, or categories..." autocomplete="off" spellcheck="false">
        </div>
        <button id="close-search-btn" class="close-search-btn">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="search-filter-pills-bar">
        <button class="search-filter-pill active" data-filter-group="category" data-filter-value="">All</button>
        <button class="search-filter-pill" data-filter-group="category" data-filter-value="Music">Music</button>
        <button class="search-filter-pill" data-filter-group="category" data-filter-value="STEM">STEM</button>
        <button class="search-filter-pill" data-filter-group="category" data-filter-value="Culture">Culture</button>
        <button class="search-filter-pill" data-filter-group="category" data-filter-value="News">News</button>
        <button class="search-filter-pill" data-filter-group="category" data-filter-value="Sports">Sports</button>
        <button class="search-filter-pill active" data-filter-group="sort" data-filter-value="newest">Newest</button>
        <button class="search-filter-pill" data-filter-group="sort" data-filter-value="popular">Popular</button>
      </div>
      <div id="search-results-grid" class="search-results-grid">
        <!-- Results loaded here -->
      </div>
    </div>
  </div>

  <!-- NOTIFICATIONS PANEL -->
  <div id="notifications-panel" class="notifications-panel">
    <div class="notifications-header">
      <h2>Notifications <span id="notifications-header-count"></span></h2>
      <button id="close-notifications" class="icon-btn">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="notification-tabs-container">
      <button class="notification-tab active" data-tab="all">All</button>
      <button class="notification-tab" data-tab="unread">Unread</button>
    </div>
    <div class="notifications-list" id="notifications-list">
      <div class="empty-notifications">
        <i class="fas fa-bell-slash"></i>
        <p>Loading notifications...</p>
      </div>
    </div>
    <div class="notifications-footer">
      <button id="mark-all-read" class="text-btn">Mark all as read</button>
      <button id="notification-settings-btn" class="text-btn"><i class="fas fa-cog"></i> Settings</button>
    </div>
  </div>

  <!-- Comments Drawer Modal -->
  <div class="modal-overlay" id="comments-modal">
    <div class="comments-drawer">
      <div class="drawer-header">
        <h3>Comments</h3>
        <button class="drawer-close" id="close-comments">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="comments-list" id="comments-list">
        <!-- Comments loaded here -->
      </div>
      <div class="comment-composer">
        <div class="composer-avatar" id="composer-avatar">
          <span id="composer-initials">U</span>
        </div>
        <textarea
          class="composer-input"
          id="comment-input"
          placeholder="Add a comment..."
          maxlength="500"
          rows="1"
        ></textarea>
        <button class="post-comment-btn" id="post-comment-btn" disabled>Post</button>
      </div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal-overlay" id="share-modal">
    <div class="share-modal">
      <div class="drawer-header">
        <h3>Share Short</h3>
        <button class="drawer-close" id="close-share">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="share-options">
        <div class="share-option" id="share-whatsapp">
          <div class="share-icon whatsapp">
            <i class="fab fa-whatsapp"></i>
          </div>
          <span class="share-label">WhatsApp</span>
        </div>
        <div class="share-option" id="share-twitter">
          <div class="share-icon twitter">
            <i class="fab fa-twitter"></i>
          </div>
          <span class="share-label">X</span>
        </div>
        <div class="share-option" id="share-instagram">
          <div class="share-icon instagram">
            <i class="fab fa-instagram"></i>
          </div>
          <span class="share-label">Instagram</span>
        </div>
        <div class="share-option" id="share-copy">
          <div class="share-icon copy">
            <i class="fas fa-link"></i>
          </div>
          <span class="share-label">Copy Link</span>
        </div>
      </div>
      <div class="share-link">
        <input type="text" id="share-link-input" readonly value="">
        <button class="copy-link-btn" id="copy-link-btn">Copy</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Custom JavaScript -->
  <script src="js/shorts-detail.js"></script>
</body>
</html>
